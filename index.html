        <svg width={size} height={size} className="-rotate-90 shrink-0">

            cy={size / 2}
            r={radius}
            stroke="currentColor"
            strokeWidth={strokeWidth}

            cy={size / 2}

            stroke="currentColor"
            strokeWidth={strokeWidth}
            strokeDasharray={circumference}
            strokeDashoffset={offset}
            strokeLinecap="round"

      const [selectedInitId, setSelectedInitId] = useState(null);
      const [newSubtaskTitle, setNewSubtaskTitle] = useState('');
      const [quickAddOpen, setQuickAddOpen] = useState(false);
      const [newSpaceOpen, setNewSpaceOpen] = useState(false);
      const [syncModalOpen, setSyncModalOpen] = useState(false);

      // Quick Add Form State
      const [qaTitle, setQaTitle] = useState('');
      const [qaSpaceId, setQaSpaceId] = useState('work');
      const [qaStatus, setQaStatus] = useState('in-progress');
      const [qaPriority, setQaPriority] = useState('medium');
      const [qaDate, setQaDate] = useState('');
      const [qaDesc, setQaDesc] = useState('');

      // New Space Form State
      const [nsName, setNsName] = useState('');
      const [nsIcon, setNsIcon] = useState('sparkles');
      const [nsColor, setNsColor] = useState('Indigo');

      // Sync Form Draft State
      const [draftUrl, setDraftUrl] = useState(syncConfig.url);
      const [draftKey, setDraftKey] = useState(syncConfig.anonKey);
      const [draftWorkspace, setDraftWorkspace] = useState(syncConfig.workspaceId);

      // Drag & Drop State
      const [draggedId, setDraggedId] = useState(null);
      const [dragOverCol, setDragOverCol] = useState(null);

      // Toast Notification
      const [toast, setToast] = useState(null);

      // Refs for preventing echo loops during Realtime updates
      const supabaseRef = useRef(null);
      const isApplyingRemoteRef = useRef(false);
      const pushTimeoutRef = useRef(null);
      const latestStateRef = useRef({ spaces, initiatives });
      const searchInputRef = useRef(null);
      const qaTitleRef = useRef(null);

      useEffect(() => {
        latestStateRef.current = { spaces, initiatives };
      }, [spaces, initiatives]);

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => {
          setToast((prev) => (prev === msg ? null : prev));
        }, 2500);
      }, []);

      // Always persist locally first (instant offline-first speed)
      useEffect(() => {
        try {
          localStorage.setItem('orbit_spaces_v2', JSON.stringify(spaces));
        } catch (e) {
          console.error('Local storage error:', e);
        }
      }, [spaces]);

      useEffect(() => {
        try {
          localStorage.setItem('orbit_initiatives_v2', JSON.stringify(initiatives));
        } catch (e) {
          console.error('Local storage error:', e);
        }
      }, [initiatives]);

      // --- SUPABASE REALTIME & SYNC ENGINE ---

      const pushToSupabase = useCallback(
        async (spacesData, initiativesData, cfgOverride = null) => {
          const cfg = cfgOverride || syncConfig;
          if (!cfg.url || !cfg.anonKey || !cfg.workspaceId || !supabaseRef.current) {
            return;
          }
          try {
            setSyncStatus('syncing');
            setSyncErrorMsg('');
            const payload = {
              id: cfg.workspaceId.trim(),
              data: {
                spaces: spacesData,
                initiatives: initiativesData,
              },
              updated_at: new Date().toISOString(),
            };

            const { error } = await supabaseRef.current
              .from('orbit_workspaces')
              .upsert(payload, { onConflict: 'id' });

            if (error) throw error;

            setSyncStatus('synced');
            setLastSyncedAt(new Date());
          } catch (err) {
            console.error('Supabase push error:', err);
            setSyncStatus('error');
            setSyncErrorMsg(err.message || 'Failed to sync to Supabase');
          }
        },
        [syncConfig]
      );

      const pullFromSupabase = useCallback(
        async (cfgOverride = null, silent = false) => {
          const cfg = cfgOverride || syncConfig;
          if (!cfg.url || !cfg.anonKey || !cfg.workspaceId || !supabaseRef.current) {
            return;
          }
          try {
            setSyncStatus('syncing');
            setSyncErrorMsg('');
            const { data, error } = await supabaseRef.current
              .from('orbit_workspaces')
              .select('data, updated_at')
              .eq('id', cfg.workspaceId.trim())
              .maybeSingle();

            if (error) throw error;

            if (data && data.data) {
              isApplyingRemoteRef.current = true;
              if (Array.isArray(data.data.spaces) && data.data.spaces.length > 0) {
                setSpaces(data.data.spaces);
              }
              if (Array.isArray(data.data.initiatives)) {
                setInitiatives(data.data.initiatives);
              }
              setTimeout(() => {
                isApplyingRemoteRef.current = false;
              }, 300);
              setSyncStatus('synced');
              setLastSyncedAt(new Date());
              if (!silent) showToast('Pulled latest cloud data');
            } else {
              // Workspace ID doesn't exist in Supabase yet -> seed it with current local data
              await pushToSupabase(
                latestStateRef.current.spaces,
                latestStateRef.current.initiatives,
                cfg
              );
              if (!silent) showToast('Initialized cloud workspace');
            }
          } catch (err) {
            console.error('Supabase pull error:', err);
            setSyncStatus('error');
            setSyncErrorMsg(err.message || 'Failed to connect to Supabase');
          }
        },
        [syncConfig, pushToSupabase, showToast]
      );

      // Initialize Supabase client & Realtime subscription whenever syncConfig changes
      useEffect(() => {
        if (!syncConfig.url || !syncConfig.anonKey || !syncConfig.workspaceId) {
          supabaseRef.current = null;
          setSyncStatus('local');
          return;
        }

        if (!window.supabase) {
          setSyncStatus('error');
          setSyncErrorMsg('Supabase SDK not loaded');
          return;
        }

        try {
          const client = window.supabase.createClient(
            syncConfig.url.trim(),
            syncConfig.anonKey.trim()
          );
          supabaseRef.current = client;

          // Initial fetch
          pullFromSupabase(syncConfig, true);

          // Subscribe to real-time updates from other devices (iPhone <-> Computer)
          const wsId = syncConfig.workspaceId.trim();
          const channel = client
            .channel(`orbit-sync-${wsId}`)
            .on(
              'postgres_changes',
              {
                event: '*',
                schema: 'public',
                table: 'orbit_workspaces',
                filter: `id=eq.${wsId}`,
              },
              (payload) => {
                const remoteData = payload.new?.data;
                if (remoteData) {
                  isApplyingRemoteRef.current = true;
                  if (Array.isArray(remoteData.spaces) && remoteData.spaces.length > 0) {
                    setSpaces(remoteData.spaces);
                  }
                  if (Array.isArray(remoteData.initiatives)) {
                    setInitiatives(remoteData.initiatives);
                  }
                  setSyncStatus('synced');
                  setLastSyncedAt(new Date());
                  setTimeout(() => {
                    isApplyingRemoteRef.current = false;
                  }, 350);
                }
              }
            )
            .subscribe();

          return () => {
            client.removeChannel(channel);
          };
        } catch (err) {
          console.error('Supabase client init error:', err);
          setSyncStatus('error');
          setSyncErrorMsg(err.message || 'Invalid Supabase URL or Key');
        }
      }, [syncConfig, pullFromSupabase]);

      // Debounced auto-push when local spaces or initiatives change
      useEffect(() => {
        if (
          !syncConfig.url ||
          !syncConfig.anonKey ||
          !syncConfig.workspaceId ||
          isApplyingRemoteRef.current
        ) {
          return;
        }

        if (pushTimeoutRef.current) clearTimeout(pushTimeoutRef.current);
        pushTimeoutRef.current = setTimeout(() => {
          pushToSupabase(spaces, initiatives);
        }, 550);

        return () => {
          if (pushTimeoutRef.current) clearTimeout(pushTimeoutRef.current);
        };
      }, [spaces, initiatives, syncConfig, pushToSupabase]);

      // Keyboard Shortcuts (Desktop)
      useEffect(() => {
        const onKeyDown = (e) => {
          const tag = e.target.tagName.toLowerCase();
          const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select';

          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            searchInputRef.current?.focus();
            return;
          }

          if (e.key === 'Escape') {
            if (quickAddOpen) return setQuickAddOpen(false);
            if (newSpaceOpen) return setNewSpaceOpen(false);
            if (syncModalOpen) return setSyncModalOpen(false);
            if (selectedInitId) return setSelectedInitId(null);
            if (mobileSearchOpen) return setMobileSearchOpen(false);
            if (document.activeElement === searchInputRef.current) {
              setSearchQuery('');
              searchInputRef.current.blur();
            }
            return;
          }

          if (isTyping) return;

          if (e.key.toLowerCase() === 'c' && !e.metaKey && !e.ctrlKey) {
            e.preventDefault();
            openQuickAdd();
          } else if (e.key === '1') {
            setViewMode('list');
          } else if (e.key === '2') {
            setViewMode('board');
          } else if (e.key === '[') {
            setSidebarCollapsed((prev) => !prev);
          }
        };

        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [quickAddOpen, newSpaceOpen, syncModalOpen, selectedInitId, mobileSearchOpen, activeSpaceId, spaces]);

      // --- COMPUTED HELPERS ---

      const spaceMap = useMemo(() => {
        const m = {};
        spaces.forEach((s) => (m[s.id] = s));
        return m;
      }, [spaces]);

      const getColorObj = (colorName) =>
        SPACE_COLORS.find((c) => c.name === colorName) || SPACE_COLORS[0];

      const getProgress = (item) => {
        if (!item.subtasks || item.subtasks.length === 0) {
          return item.status === 'done' ? 100 : 0;
        }
        const doneCount = item.subtasks.filter((s) => s.completed).length;
        return Math.round((doneCount / item.subtasks.length) * 100);
      };

      const filteredInitiatives = useMemo(() => {
        return initiatives.filter((item) => {
          if (activeSpaceId !== 'all' && item.spaceId !== activeSpaceId) return false;
          if (priorityFilter !== 'all' && item.priority !== priorityFilter) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const matchTitle = item.title.toLowerCase().includes(q);
            const matchCode = item.code.toLowerCase().includes(q);
            const matchDesc = (item.description || '').toLowerCase().includes(q);
            const matchSub = (item.subtasks || []).some((s) => s.title.toLowerCase().includes(q));
            if (!matchTitle && !matchCode && !matchDesc && !matchSub) return false;
          }
          return true;
        });
      }, [initiatives, activeSpaceId, priorityFilter, searchQuery]);

      const selectedInitiative = useMemo(
        () => initiatives.find((i) => i.id === selectedInitId) || null,
        [initiatives, selectedInitId]
      );

      const spaceCounts = useMemo(() => {
        const counts = { all: initiatives.length };
        spaces.forEach((s) => {
          counts[s.id] = initiatives.filter((i) => i.spaceId === s.id).length;
        });
        return counts;
      }, [initiatives, spaces]);

      // --- ACTIONS ---

      const openQuickAdd = (defaultStatus = 'in-progress') => {
        setQaTitle('');
        setQaSpaceId(activeSpaceId !== 'all' ? activeSpaceId : spaces[0]?.id || 'work');
        setQaStatus(defaultStatus);
        setQaPriority('medium');
        setQaDate('');
        setQaDesc('');
        setQuickAddOpen(true);
        setTimeout(() => qaTitleRef.current?.focus(), 60);
      };

      const handleCreateInitiative = (e) => {
        e.preventDefault();
        if (!qaTitle.trim()) return;
        const sp = spaceMap[qaSpaceId] || spaces[0];
        const prefix = (sp?.name || 'ORB').slice(0, 3).toUpperCase();
        const code = `${prefix}-${Math.floor(100 + Math.random() * 899)}`;

        const created = {
          id: `init-${Date.now()}`,
          code,
          title: qaTitle.trim(),
          spaceId: qaSpaceId,
          status: qaStatus,
          priority: qaPriority,
          targetDate: qaDate,
          description: qaDesc.trim(),
          subtasks: [],
          updatedAt: new Date().toISOString(),
        };

        setInitiatives((prev) => [created, ...prev]);
        setQuickAddOpen(false);
        showToast(`Created ${code}`);
      };

      const handleCreateSpace = (e) => {
        e.preventDefault();
        if (!nsName.trim()) return;
        const id =
          nsName
            .trim()
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-') +
          '-' +
          Date.now().toString().slice(-3);

        const created = {
          id,
          name: nsName.trim(),
          icon: nsIcon,
          color: nsColor,
        };

        setSpaces((prev) => [...prev, created]);
        setActiveSpaceId(id);
        setNsName('');
        setNewSpaceOpen(false);
        showToast(`Created "${created.name}" space`);
      };

      const updateInitiative = (id, patch) => {
        setInitiatives((prev) =>
          prev.map((item) =>
            item.id === id ? { ...item, ...patch, updatedAt: new Date().toISOString() } : item
          )
        );
      };

      const cycleStatus = (e, item) => {
        e.stopPropagation();
        const next = STATUS_ORDER[(STATUS_ORDER.indexOf(item.status) + 1) % STATUS_ORDER.length];
        updateInitiative(item.id, { status: next });
      };

      const cyclePriority = (e, item) => {
        e.stopPropagation();
        const next =
          PRIORITY_ORDER[(PRIORITY_ORDER.indexOf(item.priority) + 1) % PRIORITY_ORDER.length];
        updateInitiative(item.id, { priority: next });
      };

      const toggleSubtask = (initId, subId) => {
        setInitiatives((prev) =>
          prev.map((item) => {
            if (item.id !== initId) return item;
            return {
              ...item,
              subtasks: (item.subtasks || []).map((st) =>
                st.id === subId ? { ...st, completed: !st.completed } : st
              ),
              updatedAt: new Date().toISOString(),
            };
          })
        );
      };

      const handleAddSubtask = (e) => {
        e.preventDefault();
        if (!selectedInitiative || !newSubtaskTitle.trim()) return;
        const st = {
          id: `sub-${Date.now()}`,
          title: newSubtaskTitle.trim(),
          completed: false,
        };
        updateInitiative(selectedInitiative.id, {
          subtasks: [...(selectedInitiative.subtasks || []), st],
        });
        setNewSubtaskTitle('');
      };

      const deleteSubtask = (subId) => {
        if (!selectedInitiative) return;
        updateInitiative(selectedInitiative.id, {
          subtasks: (selectedInitiative.subtasks || []).filter((s) => s.id !== subId),
        });
      };

      const deleteInitiative = (id) => {
        setInitiatives((prev) => prev.filter((i) => i.id !== id));
        if (selectedInitId === id) setSelectedInitId(null);
        showToast('Initiative deleted');
      };

      const saveSyncConfig = (e) => {
        e.preventDefault();
        const nextCfg = {
          url: draftUrl.trim(),
          anonKey: draftKey.trim(),
          workspaceId: draftWorkspace.trim(),
        };
        setSyncConfig(nextCfg);
        localStorage.setItem('orbit_supabase_cfg_v1', JSON.stringify(nextCfg));
        setSyncModalOpen(false);
        if (nextCfg.url && nextCfg.anonKey && nextCfg.workspaceId) {
          showToast('Cloud Sync connected');
        } else {
          showToast('Switched to Local Only');
        }
      };

      const copySqlSetup = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(SUPABASE_SQL_SNIPPET).then(() => {
            showToast('SQL copied to clipboard');
          });
        } else {
          const el = document.createElement('textarea');
          el.value = SUPABASE_SQL_SNIPPET;
          document.body.appendChild(el);
          el.select();
          document.execCommand('copy');
          document.body.removeChild(el);
          showToast('SQL copied to clipboard');
        }
      };

      const formatShortDate = (dateStr) => {
        if (!dateStr) return null;
        const d = new Date(dateStr + 'T00:00:00');
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      };

      const activeSpaceObj = activeSpaceId === 'all' ? null : spaceMap[activeSpaceId];

      // Sync Status Pill Helper
      const renderSyncPill = (compact = false) => {
        let dotClass = 'bg-slate-500';
        let label = 'Local Only';
        let textClass = 'text-slate-400';

        if (syncStatus === 'syncing') {
          dotClass = 'bg-amber-400 animate-pulse';
          label = 'Syncing...';
          textClass = 'text-amber-300';
        } else if (syncStatus === 'synced') {
          dotClass = 'bg-emerald-400';
          label = 'Synced';
          textClass = 'text-emerald-300';
        } else if (syncStatus === 'error') {
          dotClass = 'bg-rose-500';
          label = 'Sync Error';
          textClass = 'text-rose-300';
        }

        return (
          <button
            onClick={() => {
              setDraftUrl(syncConfig.url);
              setDraftKey(syncConfig.anonKey);
              setDraftWorkspace(syncConfig.workspaceId);
              setSyncModalOpen(true);
            }}
            className="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-[#191c23] hover:bg-[#222630] border border-[#23262f] text-[12px] font-medium transition-colors min-h-[34px]"
            title="Configure Cross-Device Supabase Sync"
          >
            <span className={`w-2 h-2 rounded-full shrink-0 ${dotClass}`} />
            {!compact && <span className={textClass}>{label}</span>}
          </button>
        );
      };

      return (
        <div className="h-[100dvh] w-full flex overflow-hidden bg-[#0d0e11] text-slate-100">
          
          {/* ========================================================== */}
          {/* DESKTOP LEFT SIDEBAR (Hidden on iPhone / Mobile < md)      */}
          {/* ========================================================== */}
          <aside
            className={`hidden md:flex flex-col border-r border-[#23262f] bg-[#14161b] transition-all duration-200 shrink-0 ${
              sidebarCollapsed ? 'w-[68px]' : 'w-60'
            }`}
          >
            {/* Brand Header */}
            <div className="h-14 px-3.5 flex items-center justify-between border-b border-[#23262f]/80 shrink-0">
              <div className="flex items-center gap-2.5 overflow-hidden">
                <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-sm shrink-0">
                  <Icon name="layers" className="w-4 h-4" />
                </div>
                {!sidebarCollapsed && (
                  <div className="truncate">
                    <div className="text-[13.5px] font-semibold tracking-tight text-white leading-none">
                      Orbit
                    </div>
                    <div className="text-[11px] text-slate-500 mt-0.5">Personal OS</div>
                  </div>
                )}
              </div>
              <button
                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="p-1.5 rounded-md text-slate-400 hover:text-white hover:bg-[#23262f] transition-colors"
                title="Toggle Sidebar ([)"
              >
                <Icon name="sliders" className="w-3.5 h-3.5" />
              </button>
            </div>

            {/* Quick Add Initiative Button */}
            <div className="p-3 shrink-0">
              <button
                onClick={() => openQuickAdd()}
                className={`w-full flex items-center justify-center gap-2 py-2 px-3 rounded-lg bg-[#191c23] hover:bg-[#20242e] border border-[#23262f] hover:border-indigo-500/40 text-slate-200 text-[13px] font-medium transition-all ${
                  sidebarCollapsed ? 'px-0' : ''
                }`}
                title="New Initiative (C)"
              >
                <Icon name="plus" className="w-4 h-4 text-indigo-400 shrink-0" />
                {!sidebarCollapsed && (
                  <>
                    <span className="flex-1 text-left">New Initiative</span>
                    <kbd className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-[#0d0e11] text-slate-400 border border-[#23262f]">
                      C
                    </kbd>
                  </>
                )}
              </button>
            </div>

            {/* Navigation Spaces */}
            <div className="flex-1 overflow-y-auto px-2.5 py-1 space-y-5">
              <div>
                <button
                  onClick={() => setActiveSpaceId('all')}
                  className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-[13px] font-medium transition-colors ${
                    activeSpaceId === 'all'
                      ? 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/20'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-[#191c23] border border-transparent'
                  }`}
                >
                  <Icon name="compass" className="w-4 h-4 shrink-0" />
                  {!sidebarCollapsed && (
                    <>
                      <span className="flex-1 text-left truncate">All Initiatives</span>
                      <span className="text-[11px] font-mono text-slate-500">
                        {spaceCounts.all || 0}
                      </span>
                    </>
                  )}
                </button>
              </div>

              <div className="space-y-1">
                {!sidebarCollapsed && (
                  <div className="px-2.5 flex items-center justify-between">
                    <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-500">
                      Spaces
                    </span>
                    <button
                      onClick={() => setNewSpaceOpen(true)}
                      className="p-0.5 rounded text-slate-500 hover:text-slate-200 hover:bg-[#23262f]"
                      title="Add Custom Space"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5" />
                    </button>
                  </div>
                )}

                <div className="space-y-0.5">
                  {spaces.map((sp) => {
                    const colorObj = getColorObj(sp.color);
                    const isActive = activeSpaceId === sp.id;
                    return (
                      <button
                        key={sp.id}
                        onClick={() => setActiveSpaceId(sp.id)}
                        className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-[13px] font-medium transition-colors ${
                          isActive
                            ? 'bg-[#191c23] text-white border border-[#23262f]'
                            : 'text-slate-400 hover:text-slate-200 hover:bg-[#191c23]/60 border border-transparent'
                        }`}
                      >
                        <span className={`w-5 h-5 rounded-md flex items-center justify-center shrink-0 ${colorObj.soft} ${colorObj.text}`}>
                          <Icon name={sp.icon} className="w-3.5 h-3.5" />
                        </span>
                        {!sidebarCollapsed && (
                          <>
                            <span className="flex-1 text-left truncate">{sp.name}</span>
                            <span className="text-[11px] font-mono text-slate-500">
                              {spaceCounts[sp.id] || 0}
                            </span>
                          </>
                        )}
                      </button>
                    );
                  })}

                  <button
                    onClick={() => setNewSpaceOpen(true)}
                    className="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-[13px] text-slate-500 hover:text-slate-300 hover:bg-[#191c23]/60 transition-colors"
                  >
                    <Icon name="folder-plus" className="w-4 h-4 shrink-0" />
                    {!sidebarCollapsed && <span>New Space</span>}
                  </button>
                </div>
              </div>
            </div>

            {/* Desktop Sidebar Footer: Cloud Sync Status */}
            <div className="p-3 border-t border-[#23262f]/80 shrink-0">
              {sidebarCollapsed ? (
                <div className="flex justify-center">{renderSyncPill(true)}</div>
              ) : (
                <div className="flex items-center justify-between gap-2">
                  {renderSyncPill(false)}
                  {syncStatus === 'synced' && (
                    <button
                      onClick={() => pullFromSupabase(syncConfig, false)}
                      className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-[#191c23] border border-transparent hover:border-[#23262f] transition-colors"
                      title="Force Refresh from Cloud"
                    >
                      <Icon name="refresh" className="w-3.5 h-3.5" />
                    </button>
                  )}
                </div>
              )}
            </div>
          </aside>

          {/* ========================================================== */}
          {/* MAIN WORKSPACE AREA                                        */}
          {/* ========================================================== */}
          <main className="flex-1 flex flex-col min-w-0 h-full overflow-hidden">
            
            {/* TOP HEADER (Mobile Safe-Area + Desktop Header) */}
            <header className="pt-safe px-4 md:px-6 pb-3 md:pb-0 md:h-14 border-b border-[#23262f] bg-[#14161b]/90 backdrop-blur-md flex items-center justify-between gap-2 shrink-0">
              {/* Left: Space Title & Count */}
              <div className="flex items-center gap-2.5 min-w-0">
                {activeSpaceObj ? (
                  <>
                    <span className={`w-7 h-7 rounded-lg flex items-center justify-center shrink-0 ${getColorObj(activeSpaceObj.color).soft} ${getColorObj(activeSpaceObj.color).text}`}>
                      <Icon name={activeSpaceObj.icon} className="w-4 h-4" />
                    </span>
                    <h1 className="text-[16px] font-semibold tracking-tight text-white truncate">
                      {activeSpaceObj.name}
                    </h1>
                  </>
                ) : (
                  <>
                    <span className="w-7 h-7 rounded-lg flex items-center justify-center bg-indigo-500/15 text-indigo-400 shrink-0">

              />
              <aside className="relative z-10 w-full md:w-[460px] h-full bg-[#14161b] border-l border-[#23262f] flex flex-col shadow-2xl">
                {/* Drawer Header */}
                <div className="pt-safe px-4 md:px-5 pb-3 md:pb-0 md:h-14 border-b border-[#23262f] flex items-center justify-between shrink-0">
                  <div className="flex items-center gap-2">
                    <span className="font-mono text-[12px] px-2 py-0.5 rounded bg-[#0d0e11] border border-[#23262f] text-slate-400">
                      {selectedInitiative.code}
                    </span>
                    <span className="text-slate-600">•</span>
                    <span className="text-[12.5px] text-slate-400">
                      {spaceMap[selectedInitiative.spaceId]?.name || 'General'}
                    </span>
                  </div>

                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => deleteInitiative(selectedInitiative.id)}
                      className="p-2.5 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 min-w-[44px] min-h-[44px] flex items-center justify-center"
                      title="Delete Initiative"
                    >
                      <Icon name="trash" className="w-4 h-4" />
                    </button>
                    <button
                      onClick={() => setSelectedInitId(null)}
                      className="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-[#23262f] min-w-[44px] min-h-[44px] flex items-center justify-center"
                      title="Close (Esc)"
                    >
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Drawer Body */}
                <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-safe">
                  {/* Editable Title */}
                  <input
                    type="text"
                    value={selectedInitiative.title}
                    onChange={(e) =>
                      updateInitiative(selectedInitiative.id, { title: e.target.value })
                    }
                    className="w-full text-lg sm:text-xl font-semibold bg-transparent border-none focus:outline-none text-white placeholder:text-slate-600"
                    placeholder="Initiative title..."
                  />

                  {/* 2x2 Properties Grid */}
                  <div className="grid grid-cols-2 gap-3 p-3.5 rounded-xl bg-[#0d0e11] border border-[#23262f]">
                    <div>
                      <label className="block text-[11px] font-medium text-slate-500 mb-1">
                        Status
                      </label>
                      <select
                        value={selectedInitiative.status}
                        onChange={(e) =>
                          updateInitiative(selectedInitiative.id, { status: e.target.value })
                        }
                        className="w-full text-[13px] font-medium px-2.5 py-2 rounded-lg bg-[#14161b] border border-[#23262f] text-slate-200 focus:outline-none focus:border-indigo-500 min-h-[40px]"
                      >
                        {STATUS_ORDER.map((s) => (
                          <option key={s} value={s}>
                            {STATUS_CONFIG[s].label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-medium text-slate-500 mb-1">
                        Priority
                      </label>
                      <select
                        value={selectedInitiative.priority}
                        onChange={(e) =>
                          updateInitiative(selectedInitiative.id, { priority: e.target.value })
                        }
                        className="w-full text-[13px] font-medium px-2.5 py-2 rounded-lg bg-[#14161b] border border-[#23262f] text-slate-200 focus:outline-none focus:border-indigo-500 min-h-[40px]"
                      >
                        {PRIORITY_ORDER.map((p) => (
                          <option key={p} value={p}>
                            {PRIORITY_CONFIG[p].label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-medium text-slate-500 mb-1">
                        Space
                      </label>
                      <select
                        value={selectedInitiative.spaceId}
                        onChange={(e) =>
                          updateInitiative(selectedInitiative.id, { spaceId: e.target.value })
                        }
                        className="w-full text-[13px] font-medium px-2.5 py-2 rounded-lg bg-[#14161b] border border-[#23262f] text-slate-200 focus:outline-none focus:border-indigo-500 min-h-[40px]"
                      >
                        {spaces.map((sp) => (
                          <option key={sp.id} value={sp.id}>
                            {sp.name}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-medium text-slate-500 mb-1">
                        Target Date
                      </label>
                      <input
                        type="date"
                        value={selectedInitiative.targetDate || ''}
                        onChange={(e) =>
                          updateInitiative(selectedInitiative.id, { targetDate: e.target.value })
                        }
                        className="w-full text-[13px] font-medium px-2.5 py-2 rounded-lg bg-[#14161b] border border-[#23262f] text-slate-200 focus:outline-none focus:border-indigo-500 min-h-[40px]"
                      />
                    </div>
                  </div>

                  {/* Notes */}
                  <div>
                    <label className="block text-[12px] font-semibold text-slate-400 mb-1.5">
                      Notes & Context
                    </label>
                    <textarea
                      rows={4}
                      value={selectedInitiative.description || ''}
                      onChange={(e) =>
                        updateInitiative(selectedInitiative.id, { description: e.target.value })
                      }
                      placeholder="Objectives, links, or notes..."
                      className="w-full text-[14px] leading-relaxed p-3 rounded-xl bg-[#0d0e11] border border-[#23262f] text-slate-200 focus:outline-none focus:border-indigo-500/60 resize-none placeholder:text-slate-600"
                    />
                  </div>

                  {/* Milestones / Subtasks */}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <label className="text-[12px] font-semibold text-slate-400">
                        Milestones
                      </label>
                      <span className="text-[12px] font-mono text-indigo-400">
                        {getProgress(selectedInitiative)}%
                      </span>
                    </div>

                    <div className="w-full h-1.5 rounded-full bg-[#0d0e11] overflow-hidden mb-3.5">
                      <div
                        className={`h-full rounded-full transition-all duration-300 ${
                          getProgress(selectedInitiative) === 100 ? 'bg-emerald-400' : 'bg-indigo-500'
                        }`}
                        style={{ width: `${getProgress(selectedInitiative)}%` }}
                      />
                    </div>

                    <div className="space-y-1.5 mb-3">
                      {(selectedInitiative.subtasks || []).map((st) => (
                        <div
                          key={st.id}
                          className="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-[#0d0e11]/60 hover:bg-[#191c23] border border-transparent hover:border-[#23262f] min-h-[44px]"
                        >
                          <button
                            onClick={() => toggleSubtask(selectedInitiative.id, st.id)}
                            className="flex items-center gap-3 text-left flex-1 min-w-0"
                          >
                            {st.completed ? (
                              <Icon name="check-circle" className="w-4 h-4 text-emerald-400 shrink-0" />
                            ) : (
                              <Icon name="circle" className="w-4 h-4 text-slate-600 shrink-0" />
                            )}
                            <span
                              className={`text-[13.5px] leading-snug ${
                                st.completed ? 'line-through text-slate-500' : 'text-slate-200'
                              }`}
                            >
                              {st.title}
                            </span>
                          </button>
                          <button
                            onClick={() => deleteSubtask(st.id)}
                            className="p-2 text-slate-500 hover:text-rose-400"
                          >
                            <Icon name="x" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleAddSubtask} className="flex items-center gap-2">
                      <input
                        type="text"
                        value={newSubtaskTitle}
                        onChange={(e) => setNewSubtaskTitle(e.target.value)}
                        placeholder="Add milestone..."
                        className="flex-1 text-[13.5px] px-3 py-2.5 rounded-xl bg-[#0d0e11] border border-[#23262f] focus:outline-none focus:border-indigo-500 text-white placeholder:text-slate-600 min-h-[44px]"
                      />
                      <button
                        type="submit"
                        disabled={!newSubtaskTitle.trim()}
                        className="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white text-[13px] font-medium min-h-[44px]"
                      >
                        Add
                      </button>
                    </form>
                  </div>
                </div>
              </aside>
            </div>
          )}

          {/* ========================================================== */}
          {/* QUICK CREATE INITIATIVE MODAL                              */}
          {/* ========================================================== */}
          {quickAddOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-start justify-center sm:pt-24 p-0 sm:p-4 bg-black/70 backdrop-blur-[2px]">
              <div className="w-full max-w-lg rounded-t-2xl sm:rounded-2xl bg-[#14161b] border border-[#23262f] shadow-2xl overflow-hidden pb-safe sm:pb-0">
                <form onSubmit={handleCreateInitiative}>
                  <div className="px-4 py-3 border-b border-[#23262f] flex items-center justify-between">
                    <span className="px-2 py-0.5 rounded bg-indigo-500/15 text-indigo-300 text-[12px] font-medium">
                      New Initiative
                    </span>
                    <button
                      type="button"
                      onClick={() => setQuickAddOpen(false)}
                      className="p-2 text-slate-400 hover:text-white"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="p-4 space-y-3">
                    <input
                      ref={qaTitleRef}
                      type="text"
                      required
                      value={qaTitle}
                      onChange={(e) => setQaTitle(e.target.value)}
                      placeholder="What do you want to achieve or build?"
                      className="w-full text-[16px] font-medium bg-transparent border-none focus:outline-none text-white placeholder:text-slate-600"
                    />

                    <textarea
                      rows={2}
                      value={qaDesc}
                      onChange={(e) => setQaDesc(e.target.value)}
                      placeholder="Optional notes or definition of done..."
                      className="w-full text-[13.5px] bg-transparent border-none focus:outline-none text-slate-300 placeholder:text-slate-600 resize-none"
                    />

                    <div className="flex flex-wrap items-center gap-2 pt-2">
                      <select
                        value={qaSpaceId}
                        onChange={(e) => setQaSpaceId(e.target.value)}
                        className="text-[12.5px] font-medium px-3 py-2 rounded-lg bg-[#191c23] border border-[#23262f] text-slate-200 min-h-[38px]"
                      >
                        {spaces.map((sp) => (
                          <option key={sp.id} value={sp.id}>
                            Space: {sp.name}
                          </option>
                        ))}
                      </select>

                      <select
                        value={qaStatus}
                        onChange={(e) => setQaStatus(e.target.value)}
                        className="text-[12.5px] font-medium px-3 py-2 rounded-lg bg-[#191c23] border border-[#23262f] text-slate-200 min-h-[38px]"
                      >
                        {STATUS_ORDER.map((s) => (
                          <option key={s} value={s}>
                            {STATUS_CONFIG[s].label}
                          </option>
                        ))}
                      </select>

                      <select
                        value={qaPriority}
                        onChange={(e) => setQaPriority(e.target.value)}
                        className="text-[12.5px] font-medium px-3 py-2 rounded-lg bg-[#191c23] border border-[#23262f] text-slate-200 min-h-[38px]"
                      >
                        {PRIORITY_ORDER.map((p) => (
                          <option key={p} value={p}>
                            {PRIORITY_CONFIG[p].label}
                          </option>
                        ))}
                      </select>

                      <input
                        type="date"
                        value={qaDate}
                        onChange={(e) => setQaDate(e.target.value)}
                        className="text-[12.5px] font-medium px-3 py-2 rounded-lg bg-[#191c23] border border-[#23262f] text-slate-200 min-h-[38px]"
                      />
                    </div>
                  </div>

                  <div className="px-4 py-3 bg-[#0d0e11] border-t border-[#23262f] flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setQuickAddOpen(false)}
                      className="px-3.5 py-2 rounded-lg text-[13px] font-medium text-slate-400 hover:text-white min-h-[40px]"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[13px] font-medium min-h-[40px]"
                    >
                      Create Initiative
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* CREATE CUSTOM SPACE MODAL                                  */}
          {/* ========================================================== */}
          {newSpaceOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-[2px]">
              <div className="w-full max-w-md rounded-2xl bg-[#14161b] border border-[#23262f] shadow-2xl overflow-hidden">
                <form onSubmit={handleCreateSpace}>
                  <div className="px-5 py-3.5 border-b border-[#23262f] flex items-center justify-between">
                    <h3 className="text-[14px] font-semibold text-white">New Space</h3>
                    <button
                      type="button"
                      onClick={() => setNewSpaceOpen(false)}
                      className="p-1.5 text-slate-400 hover:text-white"
                    >
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>

                  <div className="p-5 space-y-4">
                    <div>
                      <label className="block text-[12px] font-medium text-slate-400 mb-1.5">
                        Space Name
                      </label>
                      <input
                        type="text"
                        required
                        autoFocus
                        value={nsName}
                        onChange={(e) => setNsName(e.target.value)}
                        placeholder="e.g., Side Projects, Fitness, Writing..."
                        className="w-full text-[14px] px-3.5 py-2.5 rounded-xl bg-[#0d0e11] border border-[#23262f] focus:outline-none focus:border-indigo-500 text-white"
                      />
                    </div>

                    <div>
                      <label className="block text-[12px] font-medium text-slate-400 mb-1.5">
                        Color
                      </label>
                      <div className="flex items-center gap-3">
                        {SPACE_COLORS.map((c) => (
                          <button
                            key={c.name}
                            type="button"
                            onClick={() => setNsColor(c.name)}
                            className={`w-8 h-8 rounded-full flex items-center justify-center ${c.dot} ${
                              nsColor === c.name ? 'ring-2 ring-offset-2 ring-offset-[#14161b] ring-white' : 'opacity-75'
                            }`}
                          >
                            {nsColor === c.name && <Icon name="check" className="w-4 h-4 text-white" />}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <label className="block text-[12px] font-medium text-slate-400 mb-1.5">
                        Icon
                      </label>
                      <div className="grid grid-cols-4 gap-2">
                        {SPACE_ICON_KEYS.map((key) => (
                          <button
                            key={key}
                            type="button"
                            onClick={() => setNsIcon(key)}
                            className={`p-2.5 rounded-xl flex items-center justify-center border min-h-[44px] ${
                              nsIcon === key
                                ? 'border-indigo-500 bg-indigo-500/15 text-indigo-300'
                                : 'border-[#23262f] bg-[#0d0e11] text-slate-400'
                            }`}
                          >
                            <Icon name={key} className="w-4 h-4" />
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div className="px-5 py-3 bg-[#0d0e11] border-t border-[#23262f] flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setNewSpaceOpen(false)}
                      className="px-3.5 py-2 rounded-lg text-[13px] font-medium text-slate-400 min-h-[40px]"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[13px] font-medium min-h-[40px]"
                    >
                      Create Space
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* SUPABASE CROSS-DEVICE CLOUD SYNC MODAL                     */}
          {/* ========================================================== */}
          {syncModalOpen && (
            <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/75 backdrop-blur-[2px]">
              <div className="w-full max-w-lg max-h-[92dvh] overflow-y-auto rounded-t-2xl sm:rounded-2xl bg-[#14161b] border border-[#23262f] shadow-2xl pb-safe sm:pb-0">
                <div className="px-5 py-3.5 border-b border-[#23262f] flex items-center justify-between sticky top-0 bg-[#14161b] z-10">
                  <div className="flex items-center gap-2">
                    <Icon name="cloud" className="w-4 h-4 text-indigo-400" />
                    <h3 className="text-[14.5px] font-semibold text-white">
                      Cross-Device Cloud Sync (Free)
                    </h3>
                  </div>
                  <button
                    onClick={() => setSyncModalOpen(false)}
                    className="p-2 text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={saveSyncConfig} className="p-5 space-y-4">
                  <p className="text-[12.5px] text-slate-400 leading-relaxed">
                    Connect a free <strong className="text-slate-200">Supabase</strong> project so your Mac/PC and iPhone sync initiatives in real time. Leave blank to stay in Local Only mode.
                  </p>

                  {/* 1-Click Copy SQL Setup Box */}
                  <div className="rounded-xl bg-[#0d0e11] border border-[#23262f] p-3">
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">
                        Step 1: Run Once in Supabase SQL Editor
                      </span>
                      <button
                        type="button"
                        onClick={copySqlSetup}
                        className="inline-flex items-center gap-1 px-2.5 py-1 rounded-md bg-[#191c23] hover:bg-[#23262f] text-[11px] font-medium text-indigo-300 border border-[#23262f]"
                      >
                        <Icon name="copy" className="w-3 h-3" />
                        <span>Copy SQL</span>
                      </button>
                    </div>
                    <pre className="text-[10.5px] font-mono text-slate-400 overflow-x-auto leading-relaxed">
                      {SUPABASE_SQL_SNIPPET}
                    </pre>
                  </div>

                  {/* Step 2: Credentials */}
                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11.5px] font-medium text-slate-400 mb-1">
                        Supabase Project URL
                      </label>
                      <input
                        type="url"
                        value={draftUrl}
                        onChange={(e) => setDraftUrl(e.target.value)}
                        placeholder="https://xyzcompany.supabase.co"
                        className="w-full text-[13px] font-mono px-3 py-2.5 rounded-xl bg-[#0d0e11] border border-[#23262f] focus:outline-none focus:border-indigo-500 text-white min-h-[42px]"
                      />
                    </div>

                    <div>
                      <label className="block text-[11.5px] font-medium text-slate-400 mb-1">
                        Supabase Anon Public Key
                      </label>
                      <input
                        type="password"
                        value={draftKey}
                        onChange={(e) => setDraftKey(e.target.value)}
                        placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..."
                        className="w-full text-[13px] font-mono px-3 py-2.5 rounded-xl bg-[#0d0e11] border border-[#23262f] focus:outline-none focus:border-indigo-500 text-white min-h-[42px]"
                      />
                    </div>

                    <div>
                      <label className="block text-[11.5px] font-medium text-slate-400 mb-1">
                        Personal Sync Passphrase (Use same on Computer & iPhone)
                      </label>
                      <input
                        type="text"
                        value={draftWorkspace}
                        onChange={(e) => setDraftWorkspace(e.target.value)}
                        placeholder="e.g., alex-orbit-secret-2026"
                        className="w-full text-[13px] font-mono px-3 py-2.5 rounded-xl bg-[#0d0e11] border border-[#23262f] focus:outline-none focus:border-indigo-500 text-white min-h-[42px]"
                      />
                    </div>
                  </div>

                  {syncErrorMsg && (
                    <div className="p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-[12px] text-rose-300">
                      {syncErrorMsg}
                    </div>
                  )}

                  {/* Manual Push / Pull Controls when connected */}
                  {syncConfig.url && syncConfig.anonKey && syncConfig.workspaceId && (
                    <div className="flex items-center justify-between pt-1 border-t border-[#23262f]">
                      <span className="text-[11px] text-slate-500">
                        {lastSyncedAt
                          ? `Last synced ${lastSyncedAt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
                          : 'Connected'}
                      </span>
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => pullFromSupabase(syncConfig, false)}
                          className="px-2.5 py-1.5 rounded-lg bg-[#191c23] hover:bg-[#23262f] border border-[#23262f] text-[11.5px] font-medium text-slate-300"
                        >
                          Force Pull
                        </button>
                        <button
                          type="button"
                          onClick={() => pushToSupabase(spaces, initiatives, syncConfig)}
                          className="px-2.5 py-1.5 rounded-lg bg-[#191c23] hover:bg-[#23262f] border border-[#23262f] text-[11.5px] font-medium text-slate-300"
                        >
                          Force Push
                        </button>
                      </div>
                    </div>
                  )}

                  <div className="flex items-center justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setSyncModalOpen(false)}
                      className="px-3.5 py-2 rounded-lg text-[13px] font-medium text-slate-400 hover:text-white min-h-[42px]"
                    >
                      Close
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-[13px] font-medium min-h-[42px]"
                    >
                      Save & Connect
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* FLOATING TOAST FEEDBACK                                    */}
          {/* ========================================================== */}
          {toast && (
            <div className="fixed top-16 md:top-auto md:bottom-5 right-4 z-50 px-3.5 py-2 rounded-xl bg-slate-100 text-slate-900 text-[12.5px] font-medium shadow-xl flex items-center gap-2">
              <Icon name="check-circle" className="w-4 h-4 text-emerald-600" />
              <span>{toast}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
